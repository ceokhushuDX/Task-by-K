<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task by K</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --surface2: #1f1f1f;
      --border: #2a2a2a;
      --accent: #c8f55a;
      --accent-dim: #a8d43a;
      --text: #f0f0f0;
      --muted: #666;
      --done: #444;
      --radius: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 80px;
      position: relative;
      overflow-x: hidden;
    }

    /* Background radial glow */
    body::before {
      content: '';
      position: fixed;
      top: -120px; left: 50%;
      transform: translateX(-50%);
      width: 700px; height: 500px;
      background: radial-gradient(ellipse, rgba(200,245,90,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      width: 100%;
      max-width: 600px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      margin-bottom: 40px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 7vw, 3.2rem);
      font-weight: 900;
      letter-spacing: -1px;
      color: var(--text);
      line-height: 1;
    }

    .brand-title span {
      color: var(--accent);
    }

    .brand-badge {
      background: var(--accent);
      color: #000;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 20px;
      margin-bottom: 4px;
    }

    .brand-sub {
      margin-top: 8px;
      font-size: 0.82rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.03em;
    }

    .brand-sub strong {
      color: var(--accent);
      font-weight: 500;
    }

    /* Stats bar */
    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-num {
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      font-weight: 700;
      line-height: 1;
      color: var(--text);
    }

    .stat-num.accent { color: var(--accent); }

    .stat-label {
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Input */
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
    }

    .task-input {
      flex: 1;
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 400;
      padding: 14px 18px;
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .task-input::placeholder { color: var(--muted); }

    .task-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200,245,90,0.1);
    }

    .add-btn {
      background: var(--accent);
      color: #000;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 14px 22px;
      border-radius: var(--radius);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: 0.02em;
    }

    .add-btn:hover { background: var(--accent-dim); }
    .add-btn:active { transform: scale(0.97); }

    /* Filter tabs */
    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
    }

    .filter-btn {
      background: none;
      border: 1.5px solid var(--border);
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 7px 16px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .filter-btn:hover { color: var(--text); border-color: #555; }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    /* Task list */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      transition: border-color 0.2s, opacity 0.2s, transform 0.2s;
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .task-item:hover { border-color: #3a3a3a; }

    .task-item.done {
      opacity: 0.5;
    }

    /* Custom checkbox */
    .check-wrap {
      flex-shrink: 0;
      width: 22px; height: 22px;
      position: relative;
    }

    .check-wrap input[type="checkbox"] {
      position: absolute; opacity: 0; width: 0; height: 0;
    }

    .check-visual {
      width: 22px; height: 22px;
      border: 2px solid var(--border);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
      background: transparent;
    }

    .check-wrap input:checked + .check-visual {
      background: var(--accent);
      border-color: var(--accent);
    }

    .check-visual svg { display: none; }
    .check-wrap input:checked + .check-visual svg { display: block; }

    .task-text {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 400;
      line-height: 1.4;
      transition: color 0.2s;
      word-break: break-word;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .delete-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      color: #444;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
    }

    .delete-btn:hover {
      color: #ff5a5a;
      background: rgba(255,90,90,0.08);
    }

    /* Task date */
    .task-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .task-date {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.03em;
    }

    .task-item.done .task-date { color: #444; }

    /* Graph range tabs */
    .graph-range {
      display: flex;
      gap: 4px;
    }

    .range-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.04em;
    }

    .range-btn:hover { color: var(--text); border-color: #555; }

    .range-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      display: none;
    }

    .empty-icon {
      font-size: 2.5rem;
      margin-bottom: 14px;
      opacity: 0.4;
    }

    .empty p {
      font-size: 0.9rem;
      font-weight: 300;
    }

    /* Footer */
    footer {
      margin-top: 50px;
      text-align: center;
      font-size: 0.72rem;
      color: #3a3a3a;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    footer span { color: var(--accent); }

    /* Clear completed */
    .actions-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 14px;
      min-height: 24px;
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      cursor: pointer;
      padding: 2px 0;
      border-bottom: 1px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }

    .clear-btn:hover { color: #ff5a5a; border-color: #ff5a5a; }

    /* ── Streak Banner ── */
    .streak-banner {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      overflow: hidden;
    }

    .streak-banner.hot {
      border-color: rgba(200,245,90,0.35);
      background: linear-gradient(135deg, #161616 60%, rgba(200,245,90,0.05));
    }

    .streak-flame {
      font-size: 2rem;
      line-height: 1;
      flex-shrink: 0;
      filter: drop-shadow(0 0 8px rgba(200,245,90,0.5));
    }

    .streak-info { flex: 1; }

    .streak-count {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }

    .streak-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-top: 2px;
    }

    .streak-message {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: right;
      max-width: 160px;
      line-height: 1.4;
    }

    .streak-message strong { color: var(--text); font-weight: 500; }

    /* ── Performance Graph ── */
    .graph-section {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 28px;
    }

    .graph-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .graph-title {
      font-size: 0.78rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .graph-legend {
      display: flex;
      gap: 12px;
    }

    .legend-dot {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.7rem;
      color: var(--muted);
    }

    .legend-dot::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-dot.completed::before { background: var(--accent); }
    .legend-dot.added::before { background: #444; }

    .graph-canvas-wrap {
      position: relative;
      height: 110px;
    }

    canvas#perfGraph {
      width: 100%;
      height: 110px;
      display: block;
    }

    .graph-days {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      padding: 0 2px;
    }

    .graph-day-label {
      font-size: 0.65rem;
      color: var(--muted);
      text-align: center;
      width: 28px;
    }
  </style>
</head>
<body>

<div class="wrapper">

  <header>
    <div class="brand">
      <h1 class="brand-title">Task <span>by K</span></h1>
      <div class="brand-badge">Beta</div>
    </div>
    <p class="brand-sub">Crafted by <strong>Khushwant Yadav</strong> · Stay on top of everything.</p>
  </header>

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <div class="stat-num" id="totalCount">0</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="pendingCount">0</div>
      <div class="stat-label">Pending</div>
    </div>
    <div class="stat">
      <div class="stat-num accent" id="doneCount">0</div>
      <div class="stat-label">Done</div>
    </div>
  </div>

  <!-- Streak Banner -->
  <div class="streak-banner" id="streakBanner">
    <div class="streak-flame" id="streakFlame">🔥</div>
    <div class="streak-info">
      <div class="streak-count" id="streakCount">0</div>
      <div class="streak-label">Day Streak</div>
    </div>
    <div class="streak-message" id="streakMsg"><strong>Complete at least one task today</strong> to start your streak!</div>
  </div>

  <!-- Performance Graph -->
  <div class="graph-section">
    <div class="graph-header">
      <div class="graph-title" id="graphTitle">Last 7 Days</div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="graph-range">
          <button class="range-btn active" onclick="setRange('7d',this)">7D</button>
          <button class="range-btn" onclick="setRange('1m',this)">1M</button>
          <button class="range-btn" onclick="setRange('6m',this)">6M</button>
          <button class="range-btn" onclick="setRange('1y',this)">1Y</button>
        </div>
        <div class="graph-legend">
          <div class="legend-dot completed">Done</div>
          <div class="legend-dot added">Added</div>
        </div>
      </div>
    </div>
    <div class="graph-canvas-wrap">
      <canvas id="perfGraph"></canvas>
    </div>
    <div class="graph-days" id="graphDays"></div>
  </div>

  <!-- Input -->
  <div class="input-row">
    <input class="task-input" id="taskInput" type="text" placeholder="Add a new task…" maxlength="120" autocomplete="off"/>
    <button class="add-btn" onclick="addTask()">+ Add</button>
  </div>

  <!-- Filters -->
  <div class="filters">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" data-filter="pending" onclick="setFilter('pending', this)">Pending</button>
    <button class="filter-btn" data-filter="done" onclick="setFilter('done', this)">Done</button>
  </div>

  <!-- Actions -->
  <div class="actions-row">
    <button class="clear-btn" id="clearBtn" onclick="clearDone()" style="display:none">Clear completed</button>
  </div>

  <!-- Task List -->
  <div class="task-list" id="taskList"></div>

  <!-- Empty State -->
  <div class="empty" id="emptyState">
    <div class="empty-icon">✦</div>
    <p>Nothing here yet.<br/>Add your first task above.</p>
  </div>

</div>

<footer>Task by K &nbsp;·&nbsp; Built by <span>Khushwant Yadav</span></footer>

<script>
  let tasks = JSON.parse(localStorage.getItem('taskbyk') || '[]');
  let filter = 'all';
  let graphRange = '7d';

  // ── Date helpers ──
  function todayKey() { return dateKey(new Date()); }

  function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function monthKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }

  function formatTaskDate(ts) {
    const d = new Date(ts);
    const now = new Date();
    const isToday = d.toDateString() === now.toDateString();
    const yest = new Date(now); yest.setDate(yest.getDate()-1);
    const isYesterday = d.toDateString() === yest.toDateString();
    if (isToday) return `Today, ${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`;
    if (isYesterday) return `Yesterday, ${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`;
    return d.toLocaleDateString([],{day:'numeric',month:'short',year:'numeric'}) +
           ', ' + d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  }

  // ── Daily log ──
  let dailyLog = JSON.parse(localStorage.getItem('taskbyk_log') || '{}');

  function saveLog() { localStorage.setItem('taskbyk_log', JSON.stringify(dailyLog)); }

  function logToday(field) {
    const k = todayKey();
    if (!dailyLog[k]) dailyLog[k] = { added:0, completed:0 };
    dailyLog[k][field]++;
    saveLog();
  }

  // ── Streak ──
  function computeStreak() {
    let streak = 0;
    const d = new Date();
    if (!((dailyLog[todayKey()]||{}).completed > 0)) d.setDate(d.getDate()-1);
    while ((dailyLog[dateKey(d)]||{}).completed > 0) { streak++; d.setDate(d.getDate()-1); }
    return streak;
  }

  function renderStreak() {
    const streak = computeStreak();
    const banner = document.getElementById('streakBanner');
    const flame  = document.getElementById('streakFlame');
    document.getElementById('streakCount').textContent = streak;
    const msg = document.getElementById('streakMsg');
    if (streak === 0) {
      flame.textContent='💤'; banner.classList.remove('hot');
      msg.innerHTML='<strong>Complete at least one task today</strong> to start your streak!';
    } else if (streak < 3) {
      flame.textContent='🔥'; banner.classList.add('hot');
      msg.innerHTML=`<strong>Nice start!</strong> Keep going tomorrow to build momentum.`;
    } else if (streak < 7) {
      flame.textContent='🔥'; banner.classList.add('hot');
      msg.innerHTML=`<strong>${streak} days strong!</strong> You're on a roll, Khushwant.`;
    } else {
      flame.textContent='🏆'; banner.classList.add('hot');
      msg.innerHTML=`<strong>Legendary!</strong> ${streak}-day streak. Unstoppable.`;
    }
  }

  // ── Range switcher ──
  function setRange(r, btn) {
    graphRange = r;
    document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const titles = {'7d':'Last 7 Days','1m':'Last 30 Days','6m':'Last 6 Months','1y':'Last 12 Months'};
    document.getElementById('graphTitle').textContent = titles[r];
    renderGraph();
  }

  // ── Build dataset for each range ──
  function buildData() {
    const points = [];
    const now = new Date();

    if (graphRange === '7d') {
      for (let i=6; i>=0; i--) {
        const d = new Date(now); d.setDate(d.getDate()-i);
        const k = dateKey(d);
        const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        points.push({
          label: days[d.getDay()],
          added: (dailyLog[k]||{}).added||0,
          completed: (dailyLog[k]||{}).completed||0,
          isNow: i===0
        });
      }
    } else if (graphRange === '1m') {
      for (let i=29; i>=0; i--) {
        const d = new Date(now); d.setDate(d.getDate()-i);
        const k = dateKey(d);
        points.push({
          label: i===0 ? 'Today' : i%7===0 ? d.getDate()+'/'+(d.getMonth()+1) : '',
          added: (dailyLog[k]||{}).added||0,
          completed: (dailyLog[k]||{}).completed||0,
          isNow: i===0
        });
      }
    } else if (graphRange === '6m') {
      // Aggregate by week (26 weeks)
      for (let w=25; w>=0; w--) {
        let added=0, completed=0;
        for (let d2=0; d2<7; d2++) {
          const d = new Date(now); d.setDate(d.getDate()-(w*7+d2));
          const k = dateKey(d);
          added += (dailyLog[k]||{}).added||0;
          completed += (dailyLog[k]||{}).completed||0;
        }
        const d = new Date(now); d.setDate(d.getDate()-w*7);
        const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        points.push({
          label: w%4===0 ? months[d.getMonth()] : '',
          added, completed, isNow: w===0
        });
      }
    } else if (graphRange === '1y') {
      // Aggregate by month (12 months)
      for (let m=11; m>=0; m--) {
        const ref = new Date(now.getFullYear(), now.getMonth()-m, 1);
        const mk = monthKey(ref);
        // Sum all days in that month from dailyLog
        let added=0, completed=0;
        Object.keys(dailyLog).forEach(k => {
          if (k.startsWith(mk)) {
            added += dailyLog[k].added||0;
            completed += dailyLog[k].completed||0;
          }
        });
        const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        points.push({ label: months[ref.getMonth()], added, completed, isNow: m===0 });
      }
    }
    return points;
  }

  // ── Canvas graph ──
  function renderGraph() {
    const canvas = document.getElementById('perfGraph');
    const wrap   = canvas.parentElement;
    const dpr    = window.devicePixelRatio || 1;
    const W      = wrap.clientWidth;
    const H      = 110;
    canvas.width  = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const points = buildData();
    const maxVal = Math.max(...points.map(p => Math.max(p.added, p.completed)), 3);
    const padL=4, padR=4, padT=12, padB=4;
    const chartW = W-padL-padR, chartH = H-padT-padB;
    const cols = points.length, colW = chartW/cols;

    // Grid
    ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1;
    for (let g=0; g<=3; g++) {
      const y = padT + chartH - (g/3)*chartH;
      ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+chartW,y); ctx.stroke();
    }

    // Bars
    points.forEach((p, i) => {
      const cx = padL + i*colW + colW/2;
      const bw = Math.min(colW*0.38, graphRange==='1y'?22:graphRange==='6m'?14:16);
      if (p.added > 0) {
        const bh = (p.added/maxVal)*chartH;
        ctx.fillStyle = p.isNow ? '#3a3a3a' : '#242424';
        roundRect(ctx, cx-bw-1, padT+chartH-bh, bw, bh, 3); ctx.fill();
      }
      if (p.completed > 0) {
        const bh = (p.completed/maxVal)*chartH;
        const grad = ctx.createLinearGradient(0, padT+chartH-bh, 0, padT+chartH);
        grad.addColorStop(0,'#c8f55a'); grad.addColorStop(1,'rgba(200,245,90,0.35)');
        ctx.fillStyle = grad;
        roundRect(ctx, cx+1, padT+chartH-bh, bw, bh, 3); ctx.fill();
      }
      if (p.isNow) {
        ctx.fillStyle='#c8f55a';
        ctx.beginPath(); ctx.arc(cx, padT-4, 3, 0, Math.PI*2); ctx.fill();
      }
    });

    // Trend line
    ctx.beginPath(); ctx.strokeStyle='rgba(200,245,90,0.28)'; ctx.lineWidth=1.5; ctx.lineJoin='round';
    points.forEach((p,i) => {
      const cx = padL + i*colW + colW/2 + 1;
      const cy = padT + chartH - (p.completed/maxVal)*chartH;
      i===0 ? ctx.moveTo(cx,cy) : ctx.lineTo(cx,cy);
    });
    ctx.stroke();

    // Labels
    const labelsEl = document.getElementById('graphDays');
    labelsEl.innerHTML = points.map(p =>
      `<div class="graph-day-label" style="width:${colW}px;color:${p.isNow?'#c8f55a':''}">${p.label}</div>`
    ).join('');
  }

  function roundRect(ctx,x,y,w,h,r) {
    if (h<=0) return;
    r = Math.min(r, h/2, w/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h); ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
  }

  // ── Core task functions ──
  function save() { localStorage.setItem('taskbyk', JSON.stringify(tasks)); }

  function addTask() {
    const input = document.getElementById('taskInput');
    const text = input.value.trim();
    if (!text) return;
    tasks.unshift({ id: Date.now(), text, done: false, createdAt: Date.now() });
    input.value = '';
    logToday('added');
    save(); render();
  }

  function toggleTask(id) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    const wasUndone = !t.done;
    t.done = !t.done;
    if (wasUndone) logToday('completed');
    else {
      const k = todayKey();
      if (dailyLog[k] && dailyLog[k].completed > 0) { dailyLog[k].completed--; saveLog(); }
    }
    save(); render();
  }

  function deleteTask(id) { tasks = tasks.filter(t => t.id !== id); save(); render(); }

  function clearDone() { tasks = tasks.filter(t => !t.done); save(); render(); }

  function setFilter(f, btn) {
    filter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function render() {
    const list = document.getElementById('taskList');
    const empty = document.getElementById('emptyState');
    const clearBtn = document.getElementById('clearBtn');

    // Migrate old tasks without createdAt
    tasks.forEach(t => { if (!t.createdAt) t.createdAt = t.id; });

    const filtered = tasks.filter(t => {
      if (filter==='pending') return !t.done;
      if (filter==='done') return t.done;
      return true;
    });

    document.getElementById('totalCount').textContent = tasks.length;
    document.getElementById('pendingCount').textContent = tasks.filter(t=>!t.done).length;
    document.getElementById('doneCount').textContent = tasks.filter(t=>t.done).length;
    clearBtn.style.display = tasks.some(t=>t.done) ? 'inline' : 'none';

    if (filtered.length === 0) {
      list.innerHTML=''; empty.style.display='block';
    } else {
      empty.style.display='none';
      list.innerHTML = filtered.map(t => `
        <div class="task-item ${t.done?'done':''}" id="item-${t.id}">
          <label class="check-wrap">
            <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.id})"/>
            <div class="check-visual">
              <svg width="12" height="10" viewBox="0 0 12 10" fill="none">
                <path d="M1 5L4.5 8.5L11 1.5" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </label>
          <div class="task-body">
            <span class="task-text">${escHtml(t.text)}</span>
            <span class="task-date">${formatTaskDate(t.createdAt)}</span>
          </div>
          <button class="delete-btn" onclick="deleteTask(${t.id})" title="Delete">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
            </svg>
          </button>
        </div>
      `).join('');
    }

    renderStreak();
    renderGraph();
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.getElementById('taskInput').addEventListener('keydown', e => { if(e.key==='Enter') addTask(); });
  window.addEventListener('resize', renderGraph);
  render();
</script>
</body>
